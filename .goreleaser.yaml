version: 2

project_name: session-protect

builds:
  - main: ./cmd/session-protect
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/rexovas/session-protect/internal/version.Version={{ .Version }}
      - -X github.com/rexovas/session-protect/internal/version.Commit={{ .ShortCommit }}
      - -X github.com/rexovas/session-protect/internal/version.Date={{ .Date }}
      - -X github.com/rexovas/session-protect/internal/version.Channel=release

archives:
  # name_template is a contract: the self-updater reconstructs these
  # names to find its platform's asset.
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README*

checksum:
  name_template: checksums.txt

# A cask, not a formula: casks are Homebrew's way to ship prebuilt binaries
# (GoReleaser deprecated `brews` for this). Installs land in Caskroom, which
# internal/update recognises as brew-managed.
homebrew_casks:
  - name: session-protect
    repository:
      owner: rexovas
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/rexovas/session-protect
    description: "Protect, explore, and command your AI coding-agent sessions"
    binaries:
      - session-protect
    # The `sp` alias the formula installed with bin.install_symlink.
    custom_block: |
      binary "session-protect", target: "sp"
    # The binaries are not signed or notarized; without this, macOS refuses
    # to run a binary downloaded by brew.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/session-protect"]
          end

changelog:
  use: github-native

release:
  # The release workflow tags locally only; GitHub creates the tag with the
  # release, on the commit being released rather than main's head.
  target_commitish: "{{ .FullCommit }}"
  draft: false
  prerelease: auto
