# Baseline Dependabot config seeded by github-repo-defaults into repos that run
# GitHub Actions but carry no .github/dependabot.yml. Patch-level github-actions
# bumps are grouped into one PR so Delegate auto-merges them once Greenlight is
# green; minor/major updates arrive as separate PRs for human review.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-patch:
        patterns: ["*"]
        update-types: ["patch"]
