name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify tag matches the module
        run: |
          go test ./... >/dev/null
          echo "releasing ${GITHUB_REF_NAME}"

      # Short-lived token from the org's app — no long-lived PAT. The app
      # needs contents:write and an installation covering homebrew-tap.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: tap-token
        with:
          client-id: ${{ secrets.OSS_APP_CLIENT_ID }}
          private-key: ${{ secrets.OSS_APP_PRIVATE_KEY }}
          owner: rexovas
          repositories: homebrew-tap

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
